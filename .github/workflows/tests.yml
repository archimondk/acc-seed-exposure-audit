name: scientific-regression-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Fetch and verify STRING v12.0 inputs
        run: python -m scripts.fetch_external_inputs --project-root .
      - name: Run scientific regression tests
        run: python -m pytest -q

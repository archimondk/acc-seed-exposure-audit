[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "acc-seed-exposure-audit"
version = "0.9.0"
description = "Reproducible audit of seed exposure and normalization sensitivity in network-propagation drug ranking by gene-set averaging."
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "pillow==12.2.0",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
include = ["analysis*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
